plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('run') {
    standardInput = System.in
}

dependencies {
    implementation project(':core')
    
    implementation 'org.eclipse.jetty:jetty-client:12.0.22'
    implementation 'org.eclipse.jetty.websocket:jetty-websocket-jetty-client:12.0.22'
}

javafx {
    version = "21"
    modules = [ 'javafx.controls', 'javafx.media' ]
}

application {
    mainClass = 'org.mediaplayer.desktop.Start'
    mainModule = 'org.mediaplayer.desktop'
}